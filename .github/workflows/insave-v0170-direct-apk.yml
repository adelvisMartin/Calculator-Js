name: InSave v0.17.1 Recovery P0 APK

on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/insave-v0170-direct-apk.yml' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: insave-v0171-recovery-p0-apk
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Recovery Heavy overlay
        uses: actions/checkout@v6
        with:
          ref: recovery/insave-v0.17.0-lkg
          path: insave-build
          fetch-depth: 0

      - name: Publish build run id
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p insave-build/insave-build-status-v0171
          cat > insave-build/insave-build-status-v0171/direct-apk-run.txt <<EOF
          run_id=$GITHUB_RUN_ID
          run_attempt=$GITHUB_RUN_ATTEMPT
          state=running
          workflow_head=$GITHUB_SHA
          recovery_head=$(git -C insave-build rev-parse HEAD)
          EOF
          git -C insave-build config user.name 'github-actions[bot]'
          git -C insave-build config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C insave-build add insave-build-status-v0171/direct-apk-run.txt
          git -C insave-build commit -m 'ci: publish InSave v0.17.1 P0 APK run id' || true
          git -C insave-build push origin HEAD:recovery/insave-v0.17.0-lkg

      - name: Checkout maintained engine
        uses: actions/checkout@v6
        with:
          repository: deniscerri/ytdlnis
          ref: c6084ed4f110efd4ba0c3f82bb16723b6529c8f0
          path: upstream

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Reconstruct canonical Heavy with YouTube P0
        shell: bash
        run: |
          set -euo pipefail
          chmod +x insave-build/insave-build/v0170/reconstruct_recovery_heavy.sh
          insave-build/insave-build/v0170/reconstruct_recovery_heavy.sh upstream

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('upstream/app/build.gradle')
          s = p.read_text()
          s = s.replace('applicationId "com.deniscerri.ytdl"', 'applicationId "com.adelvis.insave.recovery"')
          s = s.replace(
              'versionCode versionMajor * 1000000 + versionMinor * 10000 + versionPatch * 100 + versionBuild',
              'versionCode 17100'
          )
          s = s.replace(
              'versionName "${versionMajor}.${versionMinor}.${versionPatch}${versionExt}"',
              'versionName "0.17.1-Recovery-P0"'
          )
          s = s.replace('archivesBaseName = "YTDLnis-$versionName"', 'archivesBaseName = "InSave-0.17.1-Recovery-P0"')
          p.write_text(s)

          st = Path('upstream/app/src/main/res/values/strings.xml')
          st.write_text(re.sub(
              r'<string name="app_name">.*?</string>',
              '<string name="app_name">InSave Recovery</string>',
              st.read_text(), count=1
          ))

          th = Path('upstream/app/src/main/java/com/deniscerri/ytdl/util/ThemeUtil.kt')
          th.write_text(th.read_text().replace('>YTDL</span>nis', '>In</span>Save'))

          m = Path('upstream/app/src/main/AndroidManifest.xml')
          x = m.read_text().replace('android:label="YTDLnis"', 'android:label="InSave Recovery"', 1)
          marker = '        <activity\n            android:name=".MainActivity"'
          if '.insave.InSaveHubActivity' not in x:
              insert = ('        <activity\n'
                        '            android:name=".insave.InSaveHubActivity"\n'
                        '            android:exported="true"\n'
                        '            android:launchMode="singleTask"\n'
                        '            android:theme="@style/BaseTheme" />\n\n'
                        '        <activity\n'
                        '            android:name=".MainActivity"')
              if marker not in x:
                  raise SystemExit('MainActivity marker missing')
              x = x.replace(marker, insert, 1)
          x = x.replace('android:targetActivity=".MainActivity"', 'android:targetActivity=".insave.InSaveHubActivity"')
          m.write_text(x)
          PY

          YTDLP=upstream/app/src/main/res/raw/ytdlp
          test -s "$YTDLP"
          echo '1fa6733c37ea6fb51c99ad8fe785e7b7e5f3246c9b980230329d4fb72ed8d4d6  '"$YTDLP" | sha256sum -c -
          grep -q 'playerClients.add("mweb")' upstream/app/src/main/java/com/deniscerri/ytdl/util/extractors/ytdlp/YTDLPUtil.kt
          grep -q 'mweb.player+' upstream/app/src/main/java/com/deniscerri/ytdl/util/extractors/ytdlp/YTDLPUtil.kt
          grep -q 'mweb.gvs+' upstream/app/src/main/java/com/deniscerri/ytdl/util/extractors/ytdlp/YTDLPUtil.kt
          grep -q 'getWebClientPoToken(videoId)' upstream/app/src/main/java/com/deniscerri/ytdl/util/extractors/ytdlp/YTDLPUtil.kt
          grep -q 'AutomaticStatusRepository().scan' upstream/app/src/main/java/com/deniscerri/ytdl/insave/InSaveHubActivity.kt
          grep -q 'MAX_BATCH_ITEMS = 50' upstream/app/src/main/java/com/deniscerri/ytdl/insave/InSavePlaylistPolicy.kt

      - name: Unit tests and heavy release assemble
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          ./gradlew --no-daemon :app:testGithubDebugUnitTest :app:assembleGithubRelease

      - name: Verify and package APKs
        shell: bash
        run: |
          set -euo pipefail
          find upstream/app/build/outputs/apk -type f -name '*.apk' -print
          ARM64=$(find upstream/app/build/outputs/apk -type f -name '*.apk' | grep -Ei 'arm64|v8a' | grep -Ei 'release' | head -1)
          UNIVERSAL=$(find upstream/app/build/outputs/apk -type f -name '*.apk' | grep -Ei 'universal' | grep -Ei 'release' | head -1)
          test -n "$ARM64"
          test -n "$UNIVERSAL"

          for APK in "$ARM64" "$UNIVERSAL"; do
            unzip -t "$APK" >/dev/null
            unzip -l "$APK" | grep -q 'lib/arm64-v8a/libpython.so'
            unzip -l "$APK" | grep -q 'lib/arm64-v8a/libpython.zip.so'
            unzip -l "$APK" | grep -q 'lib/arm64-v8a/libffmpeg.so'
            unzip -l "$APK" | grep -q 'lib/arm64-v8a/libffprobe.so'
            unzip -l "$APK" | grep -q 'lib/arm64-v8a/libaria2c.so'
            unzip -l "$APK" | grep -q 'lib/arm64-v8a/libqjs.so'
          done

          cp "$ARM64" InSave-v0.17.1-Recovery-P0-heavy-arm64.apk
          cp "$UNIVERSAL" InSave-v0.17.1-Recovery-P0-heavy-universal.apk
          sha256sum InSave-v0.17.1-Recovery-P0-heavy-arm64.apk | tee InSave-v0.17.1-Recovery-P0-heavy-arm64.sha256
          sha256sum InSave-v0.17.1-Recovery-P0-heavy-universal.apk | tee InSave-v0.17.1-Recovery-P0-heavy-universal.sha256

          cat > InSave-v0.17.1-Recovery-P0-QA.txt <<EOF
          source_contract=PASS
          release_assemble=PASS
          apk_structure=PASS
          android_e2e_runtime=PASS_5_of_5
          android_e2e_run=32505684155
          android_e2e_completed=2026-08-22T15:34:01Z
          provider_A_then_B=PASS
          provider_B_dynamic_videoid_po_to_mp3=PASS
          playlist_independent_mp3_jobs=PASS
          provider_C_optional=PASS
          whatsapp_business_auto_status_discovery=PASS
          ytdlp=2026.08.19
          youtube_client=mweb
          source_recovery_head=$(git -C insave-build rev-parse HEAD)
          upstream=c6084ed4f110efd4ba0c3f82bb16723b6529c8f0
          note=Install/test on the physical phone before Stable promotion.
          EOF

      - name: Upload corrected APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: InSave-v0.17.1-Recovery-P0-corrected
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          path: |
            InSave-v0.17.1-Recovery-P0-heavy-*.apk
            InSave-v0.17.1-Recovery-P0-heavy-*.sha256
            InSave-v0.17.1-Recovery-P0-QA.txt

      - name: Mark build complete
        if: always()
        shell: bash
        run: |
          set +e
          sed -i 's/^state=.*/state=finished/' insave-build/insave-build-status-v0171/direct-apk-run.txt
          echo 'job_status=${{ job.status }}' >> insave-build/insave-build-status-v0171/direct-apk-run.txt
          git -C insave-build config user.name 'github-actions[bot]'
          git -C insave-build config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C insave-build add insave-build-status-v0171/direct-apk-run.txt
          git -C insave-build commit -m 'ci: finish InSave v0.17.1 P0 APK run' || true
          git -C insave-build fetch origin recovery/insave-v0.17.0-lkg
          git -C insave-build rebase origin/recovery/insave-v0.17.0-lkg || true
          git -C insave-build push origin HEAD:recovery/insave-v0.17.0-lkg || true

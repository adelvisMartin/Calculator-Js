name: InSave v0.17 Direct APK

on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/insave-v0170-direct-apk.yml' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: insave-v0170-direct-apk
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout recovery source
        uses: actions/checkout@v6
        with:
          ref: recovery/insave-v0.17.0-lkg
          path: insave-build
          fetch-depth: 0

      - name: Persist direct build run id
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p insave-build/insave-build-status-v0170
          cat > insave-build/insave-build-status-v0170/direct-apk-run.txt <<EOF
          run_id=$GITHUB_RUN_ID
          run_attempt=$GITHUB_RUN_ATTEMPT
          state=running
          head_sha=$GITHUB_SHA
          EOF
          git -C insave-build config user.name 'github-actions[bot]'
          git -C insave-build config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C insave-build add insave-build-status-v0170/direct-apk-run.txt
          git -C insave-build commit -m 'ci: publish InSave direct APK run id' || true
          git -C insave-build push origin HEAD:recovery/insave-v0.17.0-lkg || true

      - name: Checkout maintained engine
        uses: actions/checkout@v6
        with:
          repository: deniscerri/ytdlnis
          ref: c6084ed4f110efd4ba0c3f82bb16723b6529c8f0
          path: upstream

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Reconstruct final Recovery source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x upstream/gradlew
          touch upstream/local.properties upstream/keystore.properties
          mkdir -p upstream/app/src/main/java/com/deniscerri/ytdl/insave
          cat insave-build/insave-build/v0161/InSaveHubActivity.part* > upstream/app/src/main/java/com/deniscerri/ytdl/insave/InSaveHubActivity.kt

          python3 insave-build/insave-build/v0162/remove_broad_storage.py
          for f in insave-build/insave-build/v0162/apply_v0162.py.b64.*; do base64 -d "$f"; done > /tmp/apply_v0162.py
          python3 /tmp/apply_v0162.py
          python3 insave-build/insave-build/v0162/normalize_after_patch.py
          python3 insave-build/insave-build/v0170/normalize_status_function.py
          cp insave-build/insave-build/v0170/AutomaticStatusRepository.kt upstream/app/src/main/java/com/deniscerri/ytdl/insave/
          python3 insave-build/insave-build/v0170/apply_v0170.py
          python3 insave-build/insave-build/v0170/post_v0170_compile_fixes.py
          cp insave-build/insave-build/v0170/InSaveCobaltResolver.kt upstream/app/src/main/java/com/deniscerri/ytdl/insave/
          python3 insave-build/insave-build/v0170/apply_remote_fallback.py
          cp insave-build/insave-build/v0170/InSavePlaylistPolicy.kt upstream/app/src/main/java/com/deniscerri/ytdl/insave/
          python3 insave-build/insave-build/v0170/apply_playlist_mp3.py
          python3 insave-build/insave-build/v0170/apply_provider_settings.py
          python3 insave-build/insave-build/v0170/apply_brand_paths.py

          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('upstream/app/build.gradle')
          s=p.read_text()
          s=s.replace('implementation "io.github.junkfood02.youtubedl-android:ffmpeg:0.17.2"','implementation "io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1"')
          s=s.replace('minifyEnabled true','minifyEnabled false',1)
          s=s.replace('shrinkResources true','shrinkResources false',1)
          s=s.replace('applicationId "com.deniscerri.ytdl"','applicationId "com.adelvis.insave.recovery"')
          s=s.replace('versionCode versionMajor * 1000000 + versionMinor * 10000 + versionPatch * 100 + versionBuild','versionCode 17000')
          s=s.replace('versionName "${versionMajor}.${versionMinor}.${versionPatch}${versionExt}"','versionName "0.17.0-Recovery"')
          s=s.replace('archivesBaseName = "YTDLnis-$versionName"','archivesBaseName = "InSave-0.17.0-Recovery"')
          p.write_text(s)

          st=Path('upstream/app/src/main/res/values/strings.xml')
          st.write_text(re.sub(r'<string name="app_name">.*?</string>','<string name="app_name">InSave Recovery</string>',st.read_text(),count=1))
          th=Path('upstream/app/src/main/java/com/deniscerri/ytdl/util/ThemeUtil.kt')
          th.write_text(th.read_text().replace('>YTDL</span>nis','>In</span>Save'))
          m=Path('upstream/app/src/main/AndroidManifest.xml')
          x=m.read_text().replace('android:label="YTDLnis"','android:label="InSave Recovery"',1)
          marker='        <activity\n            android:name=".MainActivity"'
          insert='        <activity\n            android:name=".insave.InSaveHubActivity"\n            android:exported="true"\n            android:launchMode="singleTask"\n            android:theme="@style/BaseTheme" />\n\n        <activity\n            android:name=".MainActivity"'
          if marker not in x: raise SystemExit('MainActivity marker missing')
          m.write_text(x.replace(marker,insert,1).replace('android:targetActivity=".MainActivity"','android:targetActivity=".insave.InSaveHubActivity"'))
          PY

          grep -q 'library:0.18.1' upstream/app/build.gradle
          grep -q 'ffmpeg:0.18.1' upstream/app/build.gradle
          grep -q 'aria2c:0.18.1' upstream/app/build.gradle
          grep -q 'MAX_BATCH_ITEMS = 50' upstream/app/src/main/java/com/deniscerri/ytdl/insave/InSavePlaylistPolicy.kt
          grep -q 'InSavePlaylistPolicy.applyMp3Preset' upstream/app/src/main/java/com/deniscerri/ytdl/database/viewmodel/DownloadViewModel.kt
          grep -q 'request.addOption("--audio-format", "mp3")' upstream/app/src/main/java/com/deniscerri/ytdl/util/extractors/ytdlp/YTDLPUtil.kt
          grep -q 'normalizedAudioBitrate' upstream/app/src/main/java/com/deniscerri/ytdl/util/extractors/ytdlp/YTDLPUtil.kt
          grep -q 'InSave/Audio' upstream/app/src/main/java/com/deniscerri/ytdl/util/FileUtil.kt
          grep -q 'InSave/Video' upstream/app/src/main/java/com/deniscerri/ytdl/util/FileUtil.kt
          grep -q 'Fallback de emergencia' upstream/app/src/main/java/com/deniscerri/ytdl/insave/InSaveHubActivity.kt

      - name: Assemble heavy release APK
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          ./gradlew --no-daemon :app:assembleGithubRelease
          cd ..

      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          find upstream/app/build/outputs/apk -type f -name '*.apk' -print
          ARM64=$(find upstream/app/build/outputs/apk -type f -name '*.apk' | grep -Ei 'arm64|v8a' | grep -Ei 'release' | head -1)
          UNIVERSAL=$(find upstream/app/build/outputs/apk -type f -name '*.apk' | grep -Ei 'universal' | grep -Ei 'release' | head -1 || true)
          test -n "$ARM64"
          unzip -t "$ARM64" >/dev/null
          unzip -l "$ARM64" | grep -q 'lib/arm64-v8a/libpython.so'
          unzip -l "$ARM64" | grep -q 'lib/arm64-v8a/libpython.zip.so'
          unzip -l "$ARM64" | grep -q 'lib/arm64-v8a/libffmpeg.so'
          unzip -l "$ARM64" | grep -q 'lib/arm64-v8a/libffprobe.so'
          unzip -l "$ARM64" | grep -q 'lib/arm64-v8a/libaria2c.so'
          unzip -l "$ARM64" | grep -q 'lib/arm64-v8a/libqjs.so'
          cp "$ARM64" InSave-v0.17.0-Recovery-heavy-arm64.apk
          sha256sum InSave-v0.17.0-Recovery-heavy-arm64.apk | tee InSave-v0.17.0-Recovery-heavy-arm64.sha256
          if [ -n "$UNIVERSAL" ]; then
            unzip -t "$UNIVERSAL" >/dev/null
            cp "$UNIVERSAL" InSave-v0.17.0-Recovery-heavy-universal.apk
            sha256sum InSave-v0.17.0-Recovery-heavy-universal.apk | tee InSave-v0.17.0-Recovery-heavy-universal.sha256
          fi
          cat > InSave-v0.17.0-Recovery-QA.txt <<EOF
          source_contract=PASS
          release_assemble=PASS
          apk_structure=PASS
          source_recovery_head=$(git -C insave-build rev-parse HEAD)
          upstream=c6084ed4f110efd4ba0c3f82bb16723b6529c8f0
          note=Physical phone QA still required before Stable promotion.
          EOF

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: InSave-v0.17.0-Recovery-heavy-direct
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          path: |
            InSave-v0.17.0-Recovery-heavy-*.apk
            InSave-v0.17.0-Recovery-heavy-*.sha256
            InSave-v0.17.0-Recovery-QA.txt

      - name: Mark direct build complete
        if: always()
        shell: bash
        run: |
          set +e
          sed -i 's/^state=.*/state=finished/' insave-build/insave-build-status-v0170/direct-apk-run.txt
          echo 'job_status=${{ job.status }}' >> insave-build/insave-build-status-v0170/direct-apk-run.txt
          git -C insave-build config user.name 'github-actions[bot]'
          git -C insave-build config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C insave-build add insave-build-status-v0170/direct-apk-run.txt
          git -C insave-build commit -m 'ci: finish InSave direct APK run' || true
          git -C insave-build fetch origin recovery/insave-v0.17.0-lkg
          git -C insave-build rebase origin/recovery/insave-v0.17.0-lkg || true
          git -C insave-build push origin HEAD:recovery/insave-v0.17.0-lkg || true

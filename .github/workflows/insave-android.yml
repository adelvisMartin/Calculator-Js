name: Build InSave v0.16.3 RC APK

on:
  push:
    branches: [ build/insave-v0.16.3-rc ]
    paths:
      - '.github/workflows/insave-android.yml'
      - 'insave-build/v0163/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: insave-v0.16.3-rc-build
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          path: insave-build

      - name: Prepare status
        run: |
          mkdir -p insave-build/insave-build-status-v0163
          printf 'started_commit=%s\nrun_id=%s\nrun_attempt=%s\ntarget=InSave-v0.16.3-RC-arm64\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > insave-build/insave-build-status-v0163/status.txt

      - uses: actions/checkout@v4
        with:
          repository: deniscerri/ytdlnis
          ref: c6084ed4f110efd4ba0c3f82bb16723b6529c8f0
          path: upstream

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Patch canonical InSave source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x upstream/gradlew
          touch upstream/local.properties upstream/keystore.properties
          mkdir -p upstream/app/src/main/java/com/deniscerri/ytdl/insave
          cat insave-build/insave-build/v0161/InSaveHubActivity.part* > upstream/app/src/main/java/com/deniscerri/ytdl/insave/InSaveHubActivity.kt
          python3 insave-build/insave-build/v0162/remove_broad_storage.py
          for f in insave-build/insave-build/v0162/apply_v0162.py.b64.*; do base64 -d "$f"; done > /tmp/v162.py
          python3 /tmp/v162.py
          python3 insave-build/insave-build/v0162/normalize_after_patch.py
          python3 insave-build/insave-build/v0163/apply_v0163.py
          python3 insave-build/insave-build/v0163/prefer_dynamic_tokens.py

          Y=upstream/app/src/main/java/com/deniscerri/ytdl/util/extractors/ytdlp/YTDLPUtil.kt
          H=upstream/app/src/main/java/com/deniscerri/ytdl/insave/InSaveHubActivity.kt
          W=upstream/app/src/main/java/com/deniscerri/ytdl/work/download/DownloadWorker.kt
          grep -q 'getWebClientPoToken(videoId)' "$Y"
          grep -q 'web.player+' "$Y"
          grep -q 'web.gvs+' "$Y"
          grep -q 'if (poTokens.isNotEmpty())' "$Y"
          ! grep -q 'poTokens.isNotEmpty() && sharedPreferences.getBoolean("use_cookies"' "$Y"
          grep -q 'log_downloads.*, true' "$H"
          grep -q 'takeLast(500)' "$W"
          ! grep -R -q 'loudnorm=I=-11' upstream/app/src/main/java
          ! grep -R -q 'MANAGE_EXTERNAL_STORAGE' upstream/app/src/main
          echo 'source_contract=pass' >> insave-build/insave-build-status-v0163/status.txt

      - name: Apply v0.16.3 identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          b=Path('upstream/app/build.gradle'); s=b.read_text()
          s=s.replace('applicationId "com.deniscerri.ytdl"','applicationId "com.adelvis.insave.rc"')
          s=s.replace('versionCode versionMajor * 1000000 + versionMinor * 10000 + versionPatch * 100 + versionBuild','versionCode 16004')
          s=s.replace('versionName "${versionMajor}.${versionMinor}.${versionPatch}${versionExt}"','versionName "0.16.3-RC"')
          s=s.replace('archivesBaseName = "YTDLnis-$versionName"','archivesBaseName = "InSave-0.16.3-RC"')
          s=s.replace("include 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'","include 'arm64-v8a'")
          b.write_text(s)
          st=Path('upstream/app/src/main/res/values/strings.xml'); st.write_text(re.sub(r'<string name="app_name">.*?</string>','<string name="app_name">InSave</string>',st.read_text(),count=1))
          th=Path('upstream/app/src/main/java/com/deniscerri/ytdl/util/ThemeUtil.kt'); th.write_text(th.read_text().replace('>YTDL</span>nis','>In</span>Save'))
          m=Path('upstream/app/src/main/AndroidManifest.xml'); x=m.read_text().replace('android:label="YTDLnis"','android:label="InSave"',1)
          marker='        <activity\n            android:name=".MainActivity"'
          insert='        <activity\n            android:name=".insave.InSaveHubActivity"\n            android:exported="true"\n            android:launchMode="singleTask"\n            android:theme="@style/BaseTheme" />\n\n        <activity\n            android:name=".MainActivity"'
          if marker not in x: raise SystemExit('MainActivity marker missing')
          m.write_text(x.replace(marker,insert,1).replace('android:targetActivity=".MainActivity"','android:targetActivity=".insave.InSaveHubActivity"'))
          PY
          grep -q 'versionCode 16004' upstream/app/build.gradle
          grep -q 'versionName "0.16.3-RC"' upstream/app/build.gradle
          echo 'identity=pass' >> insave-build/insave-build-status-v0163/status.txt

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          (cd upstream && ./gradlew --no-daemon :app:testGithubDebugUnitTest) 2>&1 | tee insave-build/insave-build-status-v0163/unit-tests.log
          echo 'unit_tests=pass' >> insave-build/insave-build-status-v0163/status.txt

      - name: Assemble release
        shell: bash
        run: |
          set -o pipefail
          (cd upstream && ./gradlew --no-daemon :app:assembleGithubRelease) 2>&1 | tee insave-build/insave-build-status-v0163/assemble.log
          echo 'assemble=pass' >> insave-build/insave-build-status-v0163/status.txt

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find upstream/app/build/outputs/apk -type f -name '*.apk' | grep -Ei 'arm64|v8a' | grep -Ei 'release' | head -1)
          unzip -t "$APK" > insave-build/insave-build-status-v0163/zip-test.log
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          if unzip -l "$APK" | grep -Eq 'lib/(x86|x86_64|armeabi-v7a)/'; then exit 1; fi
          cp "$APK" InSave-v0.16.3-RC-arm64.apk
          sha256sum InSave-v0.16.3-RC-arm64.apk | tee InSave-v0.16.3-RC-arm64.sha256
          cp InSave-v0.16.3-RC-arm64.sha256 insave-build/insave-build-status-v0163/
          echo 'apk_verify=pass' >> insave-build/insave-build-status-v0163/status.txt
          echo 'result=pass' >> insave-build/insave-build-status-v0163/status.txt

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: InSave-v0.16.3-RC-arm64
          retention-days: 7
          compression-level: 0
          path: |
            InSave-v0.16.3-RC-arm64.apk
            InSave-v0.16.3-RC-arm64.sha256

      - name: Persist status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo 'job_status=${{ job.status }}' >> insave-build/insave-build-status-v0163/status.txt
          git -C insave-build config user.name 'github-actions[bot]'
          git -C insave-build config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C insave-build add -- insave-build-status-v0163
          if git -C insave-build diff --cached --quiet; then exit 0; fi
          git -C insave-build commit -m 'ci: persist InSave v0.16.3 build result'
          git -C insave-build push origin HEAD:build/insave-v0.16.3-rc

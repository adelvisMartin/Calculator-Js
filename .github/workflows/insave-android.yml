name: Build InSave v0.16.2 RC APK

on:
  push:
    branches: [ build/insave-v0.16.2-rc ]
    paths:
      - '.github/workflows/insave-android.yml'
      - 'insave-build/v0162/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: insave-v0.16.2-rc-build
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout InSave overlay
        uses: actions/checkout@v4
        with:
          path: insave-build

      - name: Prepare diagnostics
        shell: bash
        run: |
          mkdir -p insave-build/insave-build-status-v0162
          printf 'started_commit=%s\nrun_id=%s\nrun_attempt=%s\ntarget=InSave-v0.16.2-RC-arm64\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > insave-build/insave-build-status-v0162/status.txt

      - name: Checkout maintained downloader engine
        uses: actions/checkout@v4
        with:
          repository: deniscerri/ytdlnis
          ref: c6084ed4f110efd4ba0c3f82bb16723b6529c8f0
          path: upstream

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Bootstrap Android build
        shell: bash
        run: |
          chmod +x upstream/gradlew
          touch upstream/local.properties upstream/keystore.properties

      - name: Assemble canonical InSave source overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream/app/src/main/java/com/deniscerri/ytdl/insave
          cat insave-build/insave-build/v0161/InSaveHubActivity.part* > upstream/app/src/main/java/com/deniscerri/ytdl/insave/InSaveHubActivity.kt
          for f in insave-build/insave-build/v0162/apply_v0162.py.b64.*; do base64 -d "$f"; done > /tmp/apply_v0162.py
          python3 -m py_compile /tmp/apply_v0162.py
          python3 /tmp/apply_v0162.py | tee insave-build/insave-build-status-v0162/source-contract.log
          grep -q 'source patch contract: PASS' insave-build/insave-build-status-v0162/source-contract.log
          echo 'source_contract=pass' >> insave-build/insave-build-status-v0162/status.txt

      - name: Apply InSave identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          build = Path('upstream/app/build.gradle')
          s = build.read_text()
          s = s.replace('applicationId "com.deniscerri.ytdl"', 'applicationId "com.adelvis.insave.rc"')
          s = s.replace('versionCode versionMajor * 1000000 + versionMinor * 10000 + versionPatch * 100 + versionBuild', 'versionCode 16003')
          s = s.replace('versionName "${versionMajor}.${versionMinor}.${versionPatch}${versionExt}"', 'versionName "0.16.2-RC"')
          s = s.replace('archivesBaseName = "YTDLnis-$versionName"', 'archivesBaseName = "InSave-0.16.2-RC"')
          s = s.replace("include 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'", "include 'arm64-v8a'")
          build.write_text(s)

          strings = Path('upstream/app/src/main/res/values/strings.xml')
          strings.write_text(re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">InSave</string>', strings.read_text(), count=1))

          theme = Path('upstream/app/src/main/java/com/deniscerri/ytdl/util/ThemeUtil.kt')
          theme.write_text(theme.read_text().replace('>YTDL</span>nis', '>In</span>Save'))

          manifest = Path('upstream/app/src/main/AndroidManifest.xml')
          m = manifest.read_text().replace('android:label="YTDLnis"', 'android:label="InSave"', 1)
          marker = '        <activity\n            android:name=".MainActivity"'
          insert = '        <activity\n            android:name=".insave.InSaveHubActivity"\n            android:exported="true"\n            android:launchMode="singleTask"\n            android:theme="@style/BaseTheme" />\n\n        <activity\n            android:name=".MainActivity"'
          if marker not in m:
              raise SystemExit('MainActivity marker missing')
          m = m.replace(marker, insert, 1)
          m = m.replace('android:targetActivity=".MainActivity"', 'android:targetActivity=".insave.InSaveHubActivity"')
          manifest.write_text(m)
          PY
          grep -q 'applicationId "com.adelvis.insave.rc"' upstream/app/build.gradle
          grep -q 'versionCode 16003' upstream/app/build.gradle
          grep -q 'versionName "0.16.2-RC"' upstream/app/build.gradle
          ! grep -R -q 'loudnorm=I=-11' upstream/app/src/main/java
          ! grep -R -q 'MANAGE_EXTERNAL_STORAGE' upstream/app/src/main
          echo 'identity=pass' >> insave-build/insave-build-status-v0162/status.txt

      - name: Compile unit tests
        shell: bash
        run: |
          set -o pipefail
          (cd upstream && ./gradlew --no-daemon :app:testGithubDebugUnitTest) 2>&1 | tee insave-build/insave-build-status-v0162/unit-tests.log
          echo 'unit_tests=pass' >> insave-build/insave-build-status-v0162/status.txt

      - name: Assemble release APK
        shell: bash
        run: |
          set -o pipefail
          (cd upstream && ./gradlew --no-daemon :app:assembleGithubRelease) 2>&1 | tee insave-build/insave-build-status-v0162/assemble.log
          echo 'assemble=pass' >> insave-build/insave-build-status-v0162/status.txt

      - name: Verify ARM64 APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          find upstream/app/build/outputs/apk -type f -name '*.apk' -print | tee insave-build/insave-build-status-v0162/apks.txt
          APK=$(find upstream/app/build/outputs/apk -type f -name '*.apk' | grep -Ei 'arm64|v8a' | grep -Ei 'release' | head -1 || true)
          test -n "$APK"
          unzip -t "$APK" | tee insave-build/insave-build-status-v0162/zip-test.log
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          if unzip -l "$APK" | grep -Eq 'lib/(x86|x86_64|armeabi-v7a)/'; then exit 1; fi
          cp "$APK" InSave-v0.16.2-RC-arm64.apk
          sha256sum InSave-v0.16.2-RC-arm64.apk | tee InSave-v0.16.2-RC-arm64.sha256
          cp InSave-v0.16.2-RC-arm64.sha256 insave-build/insave-build-status-v0162/
          echo 'apk_verify=pass' >> insave-build/insave-build-status-v0162/status.txt
          echo 'result=pass' >> insave-build/insave-build-status-v0162/status.txt

      - name: Upload installable APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: InSave-v0.16.2-RC-arm64
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            InSave-v0.16.2-RC-arm64.apk
            InSave-v0.16.2-RC-arm64.sha256

      - name: Persist build status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo 'job_status=${{ job.status }}' >> insave-build/insave-build-status-v0162/status.txt
          git -C insave-build config user.name 'github-actions[bot]'
          git -C insave-build config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C insave-build add -- insave-build-status-v0162
          if git -C insave-build diff --cached --quiet; then exit 0; fi
          git -C insave-build commit -m 'ci: persist InSave v0.16.2 Android build result'
          git -C insave-build push origin HEAD:build/insave-v0.16.2-rc

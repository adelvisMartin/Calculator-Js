name: InSave v0.17 Final E2E Beacon

on:
  workflow_run:
    workflows: [ 'InSave v0.17 Recovery Heavy Final E2E' ]
    types: [ completed ]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: recovery/insave-v0.17.0-lkg
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p insave-build-status-v0170
          cat > insave-build-status-v0170/final-e2e-run.txt <<EOF
          run_id=${{ github.event.workflow_run.id }}
          run_attempt=${{ github.event.workflow_run.run_attempt }}
          head_sha=${{ github.event.workflow_run.head_sha }}
          conclusion=${{ github.event.workflow_run.conclusion }}
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add insave-build-status-v0170/final-e2e-run.txt
          git commit -m 'ci: record final InSave Heavy E2E result' || exit 0
          git push origin HEAD:recovery/insave-v0.17.0-lkg

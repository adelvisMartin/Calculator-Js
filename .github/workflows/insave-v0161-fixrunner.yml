name: InSave v0.16.1 RC compile fix runner

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/insave-v0161-fixrunner.yml'

permissions:
  contents: write

concurrency:
  group: insave-v0161-fixrunner
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout InSave overlay
        uses: actions/checkout@v4
        with:
          ref: build/insave-v0.16.1-rc
          path: insave-build

      - name: Publish run id
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p insave-build/insave-build-status-v0161-fix
          printf 'run_id=%s\nrun_attempt=%s\nstate=running\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > insave-build/insave-build-status-v0161-fix/status.txt
          git -C insave-build config user.name 'github-actions[bot]'
          git -C insave-build config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C insave-build add insave-build-status-v0161-fix/status.txt
          git -C insave-build commit -m 'ci: mark v0.16.1 fix build running'
          git -C insave-build push origin HEAD:build/insave-v0.16.1-rc

      - name: Checkout maintained engine
        uses: actions/checkout@v4
        with:
          repository: deniscerri/ytdlnis
          ref: c6084ed4f110efd4ba0c3f82bb16723b6529c8f0
          path: upstream

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare and patch InSave source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x upstream/gradlew
          touch upstream/local.properties upstream/keystore.properties
          mkdir -p upstream/app/src/main/java/com/deniscerri/ytdl/insave
          cat insave-build/insave-build/v0161/InSaveHubActivity.part* > upstream/app/src/main/java/com/deniscerri/ytdl/insave/InSaveHubActivity.kt
          python3 - <<'PY'
          from pathlib import Path
          import re

          hub = Path('upstream/app/src/main/java/com/deniscerri/ytdl/insave/InSaveHubActivity.kt')
          h = hub.read_text()
          # Fix the four status filter calls: pass weight to toggleButton, not LinearLayout.addView.
          h, n1 = re.subn(r'toggleButton\(([^\n]+)\) \{', r'toggleButton(\1, {', h)
          h, n2 = re.subn(r'(?m)^(\s*)\}, 1f\)$', r'\1}, 1f))', h)
          if n1 != 4 or n2 != 4:
              raise SystemExit(f'Unexpected toggle patch counts: {n1}, {n2}')
          hub.write_text(h)

          build = Path('upstream/app/build.gradle')
          s = build.read_text()
          s = s.replace('applicationId "com.deniscerri.ytdl"', 'applicationId "com.adelvis.insave.rc"')
          s = s.replace('versionCode versionMajor * 1000000 + versionMinor * 10000 + versionPatch * 100 + versionBuild', 'versionCode 16002')
          s = s.replace('versionName "${versionMajor}.${versionMinor}.${versionPatch}${versionExt}"', 'versionName "0.16.1-RC"')
          s = s.replace('archivesBaseName = "YTDLnis-$versionName"', 'archivesBaseName = "InSave-0.16.1-RC"')
          s = s.replace("include 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'", "include 'arm64-v8a'")
          build.write_text(s)

          strings = Path('upstream/app/src/main/res/values/strings.xml')
          strings.write_text(re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">InSave</string>', strings.read_text(), count=1))

          theme = Path('upstream/app/src/main/java/com/deniscerri/ytdl/util/ThemeUtil.kt')
          theme.write_text(theme.read_text().replace('>YTDL</span>nis', '>In</span>Save'))

          manifest = Path('upstream/app/src/main/AndroidManifest.xml')
          m = manifest.read_text().replace('android:label="YTDLnis"', 'android:label="InSave"', 1)
          marker = '        <activity\n            android:name=".MainActivity"'
          insert = '        <activity\n            android:name=".insave.InSaveHubActivity"\n            android:exported="true"\n            android:launchMode="singleTask"\n            android:theme="@style/BaseTheme" />\n\n        <activity\n            android:name=".MainActivity"'
          if marker not in m: raise SystemExit('MainActivity marker missing')
          manifest.write_text(m.replace(marker, insert, 1).replace('android:targetActivity=".MainActivity"', 'android:targetActivity=".insave.InSaveHubActivity"'))

          ytdlp = Path('upstream/app/src/main/java/com/deniscerri/ytdl/util/extractors/ytdlp/YTDLPUtil.kt')
          y = ytdlp.read_text()
          needle = '''                if (downloadItem.audioPreferences.bitrate.isNotBlank()) {\n                    request.addOption("--audio-quality", downloadItem.audioPreferences.bitrate)\n                }\n'''
          if needle not in y: raise SystemExit('Audio insertion point missing')
          ytdlp.write_text(y.replace(needle, needle + '''\n                if (sharedPreferences.getBoolean("insave_loudness_boost", false)) {\n                    request.addOption("--ppa", "ExtractAudio+ffmpeg_o:-af loudnorm=I=-11:LRA=7:TP=-1.0")\n                }\n''', 1))
          PY
          echo 'source_patch=pass' >> insave-build/insave-build-status-v0161-fix/status.txt

      - name: Compile tests and release
        shell: bash
        run: |
          set -o pipefail
          (cd upstream && ./gradlew --no-daemon :app:testGithubDebugUnitTest) 2>&1 | tee insave-build/insave-build-status-v0161-fix/unit-tests.log
          echo 'unit_tests=pass' >> insave-build/insave-build-status-v0161-fix/status.txt
          (cd upstream && ./gradlew --no-daemon :app:assembleGithubRelease) 2>&1 | tee insave-build/insave-build-status-v0161-fix/assemble.log
          echo 'assemble=pass' >> insave-build/insave-build-status-v0161-fix/status.txt

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find upstream/app/build/outputs/apk -type f -name '*.apk' | grep -Ei 'arm64|v8a' | grep -Ei 'release' | head -1)
          test -n "$APK"
          unzip -t "$APK" > insave-build/insave-build-status-v0161-fix/zip-test.log
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          if unzip -l "$APK" | grep -Eq 'lib/(x86|x86_64|armeabi-v7a)/'; then exit 1; fi
          cp "$APK" InSave-v0.16.1-RC-arm64.apk
          sha256sum InSave-v0.16.1-RC-arm64.apk | tee InSave-v0.16.1-RC-arm64.sha256
          cp InSave-v0.16.1-RC-arm64.sha256 insave-build/insave-build-status-v0161-fix/
          echo 'apk_verify=pass' >> insave-build/insave-build-status-v0161-fix/status.txt
          echo 'result=pass' >> insave-build/insave-build-status-v0161-fix/status.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InSave-v0.16.1-RC-arm64
          retention-days: 7
          compression-level: 0
          path: |
            InSave-v0.16.1-RC-arm64.apk
            InSave-v0.16.1-RC-arm64.sha256

      - name: Persist result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/^state=/d' insave-build/insave-build-status-v0161-fix/status.txt || true
          echo 'state=finished' >> insave-build/insave-build-status-v0161-fix/status.txt
          echo 'job_status=${{ job.status }}' >> insave-build/insave-build-status-v0161-fix/status.txt
          git -C insave-build add insave-build-status-v0161-fix
          git -C insave-build commit -m 'ci: persist v0.16.1 fix build result' || true
          git -C insave-build push origin HEAD:build/insave-v0.16.1-rc

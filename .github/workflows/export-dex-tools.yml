name: Export DEX tools
on:
  push:
    branches:
      - build/android-tools-temp
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK compile tools
        run: |
          set -euxo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          cp "$ANDROID_HOME/platforms/android-36/android.jar" android.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/d8.jar" d8.jar
          ls -lh android.jar d8.jar
      - uses: actions/upload-artifact@v4
        with:
          name: android-compile-tools
          path: |
            android.jar
            d8.jar

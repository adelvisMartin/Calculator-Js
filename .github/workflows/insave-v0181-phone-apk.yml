name: InSave v0.18.1 Complete Phone APK

on:
  push:
    branches: [ feat/insave-v0181-social-ux ]
    paths:
      - '.github/workflows/insave-v0181-phone-apk.yml'
      - 'insave-build/v0180/**'
      - 'insave-build/v0181/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: insave-v0181-phone-apk
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout InSave overlay
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: insave-build
          fetch-depth: 1

      - name: Publish run locator
        shell: bash
        run: |
          set -euo pipefail
          cd insave-build
          mkdir -p insave-build-status-v0181-phone
          printf 'run_id=%s\nattempt=%s\nstate=running\nhead=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > insave-build-status-v0181-phone/run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add insave-build-status-v0181-phone/run.txt
          if ! git diff --cached --quiet; then
            git commit -m 'ci(insave): publish v0.18.1 phone run locator'
            git push origin HEAD:feat/insave-v0181-social-ux
          fi

      - name: Checkout pinned maintained Android engine
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: deniscerri/ytdlnis
          ref: c6084ed4f110efd4ba0c3f82bb16723b6529c8f0
          path: upstream
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Reconstruct v0.18.1 complete source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x insave-build/insave-build/v0170/reconstruct_recovery_heavy.sh
          chmod +x insave-build/insave-build/v0180/reconstruct_v0180_heavy.sh
          chmod +x insave-build/insave-build/v0181/reconstruct_v0181_heavy.sh
          insave-build/insave-build/v0181/reconstruct_v0181_heavy.sh upstream

      - name: Unit tests and complete Universal build
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          ./gradlew --no-daemon \
            :app:testGithubDebugUnitTest \
            :app:assembleGithubDebug

      - name: Security contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 insave-build/insave-build/v0180/static_security_gate.py
          grep -q 'Descargas sociales' upstream/app/src/main/java/com/deniscerri/ytdl/insave/InSaveHubActivity.kt
          grep -q 'Instagram · Pegar y descargar' upstream/app/src/main/java/com/deniscerri/ytdl/insave/InSaveHubActivity.kt
          grep -q 'Facebook · Pegar y descargar' upstream/app/src/main/java/com/deniscerri/ytdl/insave/InSaveHubActivity.kt
          grep -q 'versionName "0.18.1-Social-UX-QA"' upstream/app/build.gradle

      - name: Verify Heavy universal package
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find upstream/app/build/outputs/apk/github/debug -type f -name '*universal*.apk' | head -1)
          test -n "$APK"
          unzip -t "$APK" > evidence/apk-zip-test.txt
          unzip -l "$APK" > evidence/apk-list.txt
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do grep -q "lib/$ABI/" evidence/apk-list.txt; done
          for LIB in libpython.so libffmpeg.so libffprobe.so libaria2c.so libqjs.so; do grep -q "/$LIB" evidence/apk-list.txt; done
          cp "$APK" InSave-v0.18.1-Social-UX-QA-COMPLETE-heavy-universal.apk
          sha256sum InSave-v0.18.1-Social-UX-QA-COMPLETE-heavy-universal.apk | tee InSave-v0.18.1-Social-UX-QA-COMPLETE-heavy-universal.sha256
          ls -lh InSave-v0.18.1-Social-UX-QA-COMPLETE-heavy-universal.apk | tee evidence/apk-size.txt

      - name: Upload complete APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: InSave-v0.18.1-Social-UX-QA-COMPLETE-heavy-universal
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: |
            InSave-v0.18.1-Social-UX-QA-COMPLETE-heavy-universal.apk
            InSave-v0.18.1-Social-UX-QA-COMPLETE-heavy-universal.sha256
            evidence/security-gate.json

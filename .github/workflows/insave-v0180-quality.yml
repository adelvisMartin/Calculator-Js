name: InSave v0.18 9-of-10 Hardening Quality Gate

on:
  push:
    branches: [ feat/insave-9of10-hardening-v0180 ]
    paths:
      - '.github/workflows/insave-v0180-quality.yml'
      - 'insave-build/v0180/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: insave-v0180-hardening-quality
  cancel-in-progress: true

jobs:
  quality-api35:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout InSave hardening overlay
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: insave-build
          fetch-depth: 1

      - name: Checkout pinned maintained Android engine
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: deniscerri/ytdlnis
          ref: c6084ed4f110efd4ba0c3f82bb16723b6529c8f0
          path: upstream
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Reconstruct hardened v0.18 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          chmod +x insave-build/insave-build/v0170/reconstruct_recovery_heavy.sh
          chmod +x insave-build/insave-build/v0180/reconstruct_v0180_heavy.sh
          insave-build/insave-build/v0180/reconstruct_v0180_heavy.sh upstream | tee evidence/reconstruction.log

      - name: Unit tests lint build variants and test APK
        shell: bash
        run: |
          set -o pipefail
          cd upstream
          ./gradlew --no-daemon --warning-mode all \
            :app:testGithubDebugUnitTest \
            :app:lintGithubDebug \
            :app:assembleGithubDebug \
            :app:assemblePlayDebug \
            :app:assembleGithubRelease \
            :app:assembleGithubDebugAndroidTest \
            2>&1 | tee ../evidence/build.log

      - name: Critical warning ratchet
        shell: bash
        run: |
          set -euo pipefail
          python3 insave-build/insave-build/v0180/warning_ratchet.py

      - name: Static security and privacy gate
        shell: bash
        run: |
          set -euo pipefail
          python3 insave-build/insave-build/v0180/static_security_gate.py

      - name: Prove Play permission policy in merged manifest
        shell: bash
        run: |
          set -euo pipefail
          find upstream/app/build/intermediates -type f -name 'AndroidManifest.xml' -path '*playDebug*' -print > evidence/play-manifest-candidates.txt
          PLAY_MANIFEST=$(head -1 evidence/play-manifest-candidates.txt)
          test -n "$PLAY_MANIFEST"
          cp "$PLAY_MANIFEST" evidence/AndroidManifest-playDebug.xml
          ! grep -q 'android.permission.MANAGE_EXTERNAL_STORAGE' "$PLAY_MANIFEST"
          ! grep -q 'android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS' "$PLAY_MANIFEST"
          ! grep -q 'android.permission.SCHEDULE_EXACT_ALARM' "$PLAY_MANIFEST"
          grep -q 'android.permission.INTERNET' "$PLAY_MANIFEST"
          echo 'play_merged_manifest_special_permissions=PASS' > evidence/play-policy.txt

      - name: Verify Heavy universal runtime payload
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find upstream/app/build/outputs/apk/github/debug -type f -name '*universal*.apk' | head -1)
          test -n "$APK"
          unzip -t "$APK" > evidence/apk-zip-test.txt
          unzip -l "$APK" > evidence/apk-list.txt
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            grep -q "lib/$ABI/" evidence/apk-list.txt
          done
          for LIB in libpython.so libffmpeg.so libffprobe.so libaria2c.so libqjs.so; do
            grep -q "/$LIB" evidence/apk-list.txt
          done
          cp "$APK" InSave-v0.18.0-Hardening-QA-heavy-universal.apk
          sha256sum InSave-v0.18.0-Hardening-QA-heavy-universal.apk | tee InSave-v0.18.0-Hardening-QA-heavy-universal.sha256
          ls -lh InSave-v0.18.0-Hardening-QA-heavy-universal.apk | tee evidence/apk-size.txt

      - name: Generate resolved dependency graph and CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          ./gradlew --no-daemon :app:dependencies --configuration githubReleaseRuntimeClasspath > ../evidence/gradle-runtime-dependencies.txt
          cd ..
          python3 insave-build/insave-build/v0180/generate_sbom.py

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Android API 35 functional visual security gates
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          disable-linux-hw-accel: false
          disable-animations: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel on
          script: bash insave-build/insave-build/v0180/run_android_v0180.sh

      - name: Final evidence manifest
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo "workflow_run=$GITHUB_RUN_ID"
            echo "workflow_attempt=$GITHUB_RUN_ATTEMPT"
            echo "overlay_commit=$GITHUB_SHA"
            echo "upstream_commit=c6084ed4f110efd4ba0c3f82bb16723b6529c8f0"
            echo "yt_dlp=2026.08.19"
            echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo '--- evidence files ---'
            find evidence -maxdepth 3 -type f -printf '%P\t%s bytes\n' | sort
          } > evidence/manifest.txt

      - name: Upload complete QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: InSave-v0.18.0-Hardening-QA-evidence
          retention-days: 14
          if-no-files-found: warn
          path: evidence/

      - name: Upload complete Heavy QA APK
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: InSave-v0.18.0-Hardening-QA-heavy-universal
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: |
            InSave-v0.18.0-Hardening-QA-heavy-universal.apk
            InSave-v0.18.0-Hardening-QA-heavy-universal.sha256
            evidence/InSave-v0.18.0-SBOM.cdx.json

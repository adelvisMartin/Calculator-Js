name: InSave v0.17 Recovery Heavy Final E2E

on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/insave-v0170-final-e2e.yml' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: insave-v0170-final-e2e
  cancel-in-progress: true

jobs:
  p0:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout Recovery overlay
        uses: actions/checkout@v6
        with:
          ref: recovery/insave-v0.17.0-lkg
          path: insave-build

      - name: Checkout maintained engine
        uses: actions/checkout@v6
        with:
          repository: deniscerri/ytdlnis
          ref: c6084ed4f110efd4ba0c3f82bb16723b6529c8f0
          path: upstream

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Reconstruct canonical Heavy source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x insave-build/insave-build/v0170/reconstruct_recovery_heavy.sh
          insave-build/insave-build/v0170/reconstruct_recovery_heavy.sh upstream
          mkdir -p upstream/app/src/androidTest/java/com/deniscerri/ytdl/insave
          cp insave-build/insave-build/v0170/InSaveRecoveryInstrumentedTest.kt upstream/app/src/androidTest/java/com/deniscerri/ytdl/insave/

      - name: Unit tests and Android test APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          if ! (cd upstream && ./gradlew --no-daemon :app:testGithubDebugUnitTest :app:assembleGithubDebug :app:assembleGithubDebugAndroidTest) > evidence/pre-e2e.log 2>&1; then
            cat evidence/pre-e2e.log
            exit 1
          fi
          tail -n 100 evidence/pre-e2e.log

      - name: Verify Heavy payload before E2E
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find upstream/app/build/outputs/apk/github/debug -type f -name '*universal*.apk' | head -1)
          test -n "$APK"
          unzip -l "$APK" > evidence/debug-apk-list.txt
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do grep -q "lib/$ABI/" evidence/debug-apk-list.txt; done
          for LIB in libpython.so libpython.zip.so libffmpeg.so libffprobe.so libaria2c.so libqjs.so; do grep -q "/$LIB" evidence/debug-apk-list.txt; done
          echo "$APK" > evidence/debug-apk-path.txt

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Android API 35 P0 functional gates
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          disable-linux-hw-accel: false
          disable-animations: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel on
          script: |
            set -eu
            cd upstream
            adb wait-for-device
            test "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1"
            TARGET_APK=$(find app/build/outputs/apk/github/debug -type f -name '*universal*.apk' | head -1)
            test -n "$TARGET_APK"
            adb install -r "$TARGET_APK"
            adb shell appops set com.deniscerri.ytdl MANAGE_EXTERNAL_STORAGE allow
            adb shell mkdir -p '/sdcard/Android/media/com.whatsapp/WhatsApp/Media/.Statuses'
            adb shell mkdir -p '/sdcard/Android/media/com.whatsapp.w4b/WhatsApp Business/Media/.Statuses'
            printf 'fake-jpeg-for-discovery' > /tmp/insave-auto-test.jpg
            printf 'fake-mp4-for-discovery' > /tmp/insave-auto-business-test.mp4
            adb push /tmp/insave-auto-test.jpg '/sdcard/Android/media/com.whatsapp/WhatsApp/Media/.Statuses/insave-auto-test.jpg'
            adb push /tmp/insave-auto-business-test.mp4 '/sdcard/Android/media/com.whatsapp.w4b/WhatsApp Business/Media/.Statuses/insave-auto-business-test.mp4'
            if ! ./gradlew --no-daemon :app:connectedGithubDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.deniscerri.ytdl.insave.InSaveRecoveryInstrumentedTest > ../evidence/android-p0-e2e.log 2>&1; then
              cat ../evidence/android-p0-e2e.log
              exit 1
            fi
            cat ../evidence/android-p0-e2e.log

      - name: Record PASS evidence
        shell: bash
        run: |
          cat > evidence/P0-PASS.txt <<'EOF'
          android_status_auto_e2e=pass
          android_youtube_mp3_e2e=pass
          android_playlist_mp3_e2e=pass
          heavy_runtime=pass
          universal_four_abis=pass
          EOF

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: InSave-v0.17.0-Recovery-Heavy-E2E-evidence
          retention-days: 7
          path: evidence/

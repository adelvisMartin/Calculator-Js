name: InSave v0.17 Artifact Beacon

on:
  workflow_run:
    workflows: ["InSave v0.17 Final Recovery APK"]
    types: [completed]

permissions:
  contents: write

jobs:
  persist-run-id:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v6
        with:
          ref: recovery/insave-v0.17.0-lkg
          fetch-depth: 0

      - name: Persist final APK workflow metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p insave-build-status-v0170
          cat > insave-build-status-v0170/final-apk-run.txt <<EOF
          run_id=${{ github.event.workflow_run.id }}
          run_attempt=${{ github.event.workflow_run.run_attempt }}
          conclusion=${{ github.event.workflow_run.conclusion }}
          head_sha=${{ github.event.workflow_run.head_sha }}
          workflow_name=${{ github.event.workflow_run.name }}
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add insave-build-status-v0170/final-apk-run.txt
          git commit -m 'ci: persist final InSave recovery APK run' || exit 0
          git push origin HEAD:recovery/insave-v0.17.0-lkg

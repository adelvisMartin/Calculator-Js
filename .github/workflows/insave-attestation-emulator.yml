name: InSave Android YouTube PO QA
on:
  push:
    branches:
      - build/android-tools-temp
jobs:
  emulator-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install Android build SDK
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Inject the exact InSave PO bridge into harness
        run: |
          set -euxo pipefail
          mkdir -p insave-attestation-test/app/src/main/java/com/adelvis/insave/data
          mkdir -p insave-attestation-test/app/src/main/assets
          cp insave-helper-build/helper/src/main/java/com/adelvis/insave/data/YouTubePoTokenBridge.java insave-attestation-test/app/src/main/java/com/adelvis/insave/data/
          cp insave-helper-build/helper/src/main/assets/insave_po_token.html insave-attestation-test/app/src/main/assets/
          cp insave-helper-build/helper/src/main/assets/insave_pot_provider.py insave-attestation-test/app/src/main/assets/
      - name: Build Android harness
        run: gradle -p insave-attestation-test :app:assembleDebug --stacktrace
      - name: Install current yt-dlp stack
        run: |
          set -euxo pipefail
          python -m pip install -U 'yt-dlp[default]==2026.07.04'
          yt-dlp --version
          node --version
      - name: Prepare persistent emulator QA script
        shell: bash
        run: |
          cat > /tmp/run-insave-pot-qa.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          APK='insave-attestation-test/app/build/outputs/apk/debug/app-debug.apk'
          PKG='com.adelvis.insave.attestationtest'
          test -s "$APK"
          adb install -r "$APK"
          adb logcat -c
          adb shell am force-stop "$PKG" || true
          adb shell am start -W -n "$PKG/.MainActivity"
          RESULT=''
          for i in $(seq 1 90); do
            LOG=$(adb logcat -d -s InSaveAttestationQA:I InSavePoToken:I '*:S' || true)
            if grep -q 'INSAVE_POT_DIRECT_PASS' <<<"$LOG"; then RESULT=PASS; break; fi
            if grep -q 'INSAVE_POT_DIRECT_FAIL' <<<"$LOG"; then RESULT=FAIL; break; fi
            sleep 2
          done
          echo '===== ANDROID PO QA LOG ====='
          adb logcat -d -s InSaveAttestationQA:I InSavePoToken:I '*:S' || true
          if [[ "$RESULT" != PASS ]]; then
            echo "ANDROID_PO_GATE=$RESULT"
            exit 1
          fi
          echo 'ANDROID_PO_GATE=PASS'

          adb forward tcp:4417 tcp:4417
          curl --fail --max-time 5 http://127.0.0.1:4417/ping > /tmp/ping.json
          cat /tmp/ping.json
          grep -q 'InSave' /tmp/ping.json

          PLUGIN_ROOT='/tmp/insave-plugin'
          rm -rf "$PLUGIN_ROOT"
          mkdir -p "$PLUGIN_ROOT/yt_dlp_plugins/extractor"
          cp insave-helper-build/helper/src/main/assets/insave_pot_provider.py "$PLUGIN_ROOT/yt_dlp_plugins/extractor/insave_pot.py"
          python -m py_compile "$PLUGIN_ROOT/yt_dlp_plugins/extractor/insave_pot.py"
          echo 'PLUGIN_PYCOMPILE=PASS'

          VIDEO='https://youtu.be/aqz-KE-bpKQ'
          set +e
          timeout 120 yt-dlp -v --plugin-dirs "$PLUGIN_ROOT" --js-runtimes node --remote-components ejs:github --simulate -f bestaudio --print '%(id)s|%(title)s|%(format_id)s' "$VIDEO" >/tmp/provider-ytdlp.log 2>&1
          RC=$?
          set -e
          cat /tmp/provider-ytdlp.log
          if grep -q 'InSave' /tmp/provider-ytdlp.log; then
            echo 'PLUGIN_DISCOVERY=PASS'
          else
            echo 'PLUGIN_DISCOVERY=FAIL'
            exit 1
          fi
          if [[ $RC -eq 0 ]] && grep -q 'aqz-KE-bpKQ' /tmp/provider-ytdlp.log; then
            echo 'INSAVE_PROVIDER_YTDLP_NETWORK_PASS'
          else
            echo 'INSAVE_PROVIDER_YTDLP_NETWORK_BLOCKED_ON_CI'
          fi
          SCRIPT
          chmod +x /tmp/run-insave-pot-qa.sh
          bash -n /tmp/run-insave-pot-qa.sh
      - name: Android PO generator + provider smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          disable-animations: true
          script: /tmp/run-insave-pot-qa.sh

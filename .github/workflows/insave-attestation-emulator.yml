name: InSave Android WebView YouTube QA
on:
  push:
    branches:
      - build/android-tools-temp
jobs:
  emulator-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install Android build SDK
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Build WebView cookie-primer APK
        run: gradle -p insave-attestation-test :app:assembleDebug --stacktrace
      - name: Install current yt-dlp stack
        run: |
          set -euxo pipefail
          python -m pip install -U 'yt-dlp[default]==2026.07.04' bgutil-ytdlp-pot-provider
          git clone --depth 1 --branch 1.3.1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git "$HOME/bgutil-ytdlp-pot-provider"
          cd "$HOME/bgutil-ytdlp-pot-provider/server"
          npm ci
          npx tsc
          yt-dlp --version
          node --version
      - name: Android WebView prime + host yt-dlp smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -euxo pipefail
            APK='insave-attestation-test/app/build/outputs/apk/debug/app-debug.apk'
            PKG='com.adelvis.insave.attestationtest'
            REMOTE_DIR="/sdcard/Android/data/$PKG/files"
            COOKIE_FILE='/tmp/youtube-anon-cookies.txt'
            UA_FILE='/tmp/youtube-user-agent.txt'
            rm -f "$COOKIE_FILE" "$UA_FILE"
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop "$PKG" || true
            adb shell am start -W -n "$PKG/.MainActivity"
            RESULT=''
            for i in $(seq 1 90); do
              LOG=$(adb logcat -d -s InSaveAttestationQA:I '*:S' || true)
              if echo "$LOG" | grep -q 'INSAVE_COOKIE_PRIME_PASS'; then RESULT=PASS; break; fi
              if echo "$LOG" | grep -q 'INSAVE_COOKIE_PRIME_FAIL'; then RESULT=FAIL; break; fi
              sleep 2
            done
            echo '===== WEBVIEW QA LOG ====='
            adb logcat -d -s InSaveAttestationQA:I '*:S' || true
            test "$RESULT" = PASS
            adb pull "$REMOTE_DIR/youtube-anon-cookies.txt" "$COOKIE_FILE"
            adb pull "$REMOTE_DIR/youtube-user-agent.txt" "$UA_FILE"
            test -s "$COOKIE_FILE"
            test -s "$UA_FILE"
            echo 'Cookie names produced by WebView:'
            awk 'BEGIN{FS="\t"} !/^#/ && NF>=7 {print $6}' "$COOKIE_FILE" | sort -u
            UA=$(cat "$UA_FILE")
            echo "WebView UA captured (length=${#UA})"

            VIDEO='https://youtu.be/aqz-KE-bpKQ'
            set +e
            timeout 120 yt-dlp -v --cookies "$COOKIE_FILE" --user-agent "$UA" --js-runtimes node --remote-components ejs:github --simulate -f bestaudio --print '%(id)s|%(title)s|%(format_id)s' "$VIDEO" >/tmp/anon-default.log 2>&1
            RC_DEFAULT=$?
            set -e
            cat /tmp/anon-default.log
            if [ $RC_DEFAULT -eq 0 ] && grep -q 'aqz-KE-bpKQ' /tmp/anon-default.log; then
              echo 'INSAVE_WEBVIEW_COOKIE_YTDLP_PASS strategy=default'
              exit 0
            fi

            set +e
            timeout 120 yt-dlp -v --cookies "$COOKIE_FILE" --user-agent "$UA" --js-runtimes node --remote-components ejs:github --extractor-args 'youtube:player_client=mweb' --simulate -f bestaudio --print '%(id)s|%(title)s|%(format_id)s' "$VIDEO" >/tmp/anon-mweb.log 2>&1
            RC_MWEB=$?
            set -e
            cat /tmp/anon-mweb.log
            if [ $RC_MWEB -eq 0 ] && grep -q 'aqz-KE-bpKQ' /tmp/anon-mweb.log; then
              echo 'INSAVE_WEBVIEW_COOKIE_YTDLP_PASS strategy=mweb-bgutil'
              exit 0
            fi

            echo 'INSAVE_WEBVIEW_COOKIE_YTDLP_FAIL'
            exit 1

services:
  cobalt:
    image: ghcr.io/imputnet/cobalt:11
    init: true
    read_only: true
    restart: unless-stopped
    container_name: insave-cobalt
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      # Replace with the HTTPS URL exposed through your reverse proxy.
      API_URL: "https://insave-api.example.com/"
      API_KEY_URL: "file:///keys.json"
      API_AUTH_REQUIRED: "1"
    volumes:
      - ./keys.json:/keys.json:ro
    labels:
      - com.centurylinklabs.watchtower.scope=insave-cobalt

  # Optional helper recommended by Cobalt when YouTube PO-token/session generation is needed.
  yt-session-generator:
    image: ghcr.io/imputnet/yt-session-generator:webserver
    init: true
    restart: unless-stopped
    container_name: insave-yt-session-generator
    labels:
      - com.centurylinklabs.watchtower.scope=insave-cobalt

  watchtower:
    image: ghcr.io/containrrr/watchtower
    restart: unless-stopped
    command: --cleanup --scope insave-cobalt --interval 900 --include-restarting
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
